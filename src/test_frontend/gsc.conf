# TEST P1 — does GSC run in the PREGAME LOBBY, and what can it see there?
#
# ⚠ DIFFERENT HOOK FROM EVERY OTHER PROJECT. This one hooks load_shared.gsc,
#   the injector's documented "Frontend" hook. load_shared.gsc links in EVERY
#   VM - frontend, MP, ZM, CP - so this payload runs in the pregame lobby AND
#   in the match. That it is the frontend hook is ACTS's own documentation
#   (coldwar/gsc.conf in ate47's menu tree); that a server VM runs there is the
#   CW dump's: eleven stock GSC scripts guard on util::is_frontend_map(), two of
#   them in system preinits (bot.gsc:39, player_shared.gsc:29). bb.gsc is
#   MP-only.
#
# ⚠ PREDICTED, not measured: both load_shared.gsc and clientids_shared.gsc are
#   in the scriptparsetree pool from the moment the main menu is up, so this
#   can be injected at the MAIN MENU with no match loaded first. The backing
#   for that is ate47's BO4 capture (docs/notes/loaded/pool_frontend.txt - BO4,
#   not CW); inject.sh says what to record if CW disagrees. It goes live in a
#   VM when that VM next LINKS load_shared: the next match for the MP half, the
#   next return-to-lobby for the frontend half (the frontend re-links on every
#   return - that is what the scene_model_shared hang proved, in CW).
#
# tools/inject.sh knows this project and picks the target itself.
#
# ⚠ #using ONLY core_common scripts. mp_common is not loaded in the frontend
#   and pulling it in from there is an untested link.

game=T9
mode=mp
script=scripts\core_common\load_shared.gsc
