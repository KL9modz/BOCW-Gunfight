# GUNFIGHT LOBBY - the lobby half of team size (klaze 2026-09-24: "build maxplayers into the
# main mod, adjustable from the app, default 12 with spectators").
#
# Hooks load_shared.gsc, which links in EVERY VM - the pregame lobby (frontend) AND the match -
# like test_frontend. gunfight_menu cannot do this job: it hooks bb.gsc (match VM only) and
# #uses mp_common, which the lobby never loads.
#
# ⚠ SECOND REPLACE TARGET: scripts\core_common\containers_shared.gsc (tools/inject.sh and the
#   panel pass it; gsc.conf has no replace field). gunfight_menu keeps clientids_shared.gsc, so
#   the two payloads own separate buffers and coexist. containers_shared has clientids_shared's
#   profile - only cp_common/load.gsc #uses it, nothing references it by hash - but the PAIR IS
#   UNTESTED: the first run must test a lobby return and a match -> lobby -> match cycle.
#
# ⚠ #using ONLY core_common scripts. mp_common is not loaded in the frontend.

game=T9
mode=mp
script=scripts\core_common\load_shared.gsc
