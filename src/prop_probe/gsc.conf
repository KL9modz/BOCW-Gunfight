# Static-prop probe — read-only. Same hook as hello_world, mp_probe and gunfight_mod.
# Reads the per-map Prop Hunt table gamedata/tables/mp/<mapname>_ph.csv at RUNTIME
# (prop.gsc:1850 does the same) and reports: row count, the five size-bucket counts,
# and whether the table's first model is a resident xmodel. No spawn, no setmodel.
# Row count is the number that matters — stock falls back to an INVISIBLE prop
# ("tag_origin", prop.gsc:1910) when a map has no table.
# Gated to one burst per map by the gf_pprobe_map dvar, so one payload covers many maps.
# See scripts/prop_probe.gsc for the packed output format and docs/notes/static-props.md.

game=T9
mode=mp
script=scripts\mp_common\bb.gsc
