# TEST C11 — seat a spectator on a team, from script, with no menu involved.
#
# Supersedes C10's approach rather than complementing it. C10 changes what happens
# at the MOMENT a player joins; C11 acts on anyone sitting in spectator, whenever.
#
# The mechanism is one stock call. level.autoassign is a function pointer
# (globallogic_ui.gsc:39 -> &menuautoassign), and passing a team as its second
# argument with comingfrommenu = 0 lands in team_assignment.gsc:419:
#
#     else if ( teamname !== #"none" && !comingfrommenu ) { assignment = teamname; }
#
# used VERBATIM, with no fullness check, no function_a3e209ba, no spectator branch.
# That is the same branch klaze already sees fire whenever "a spot is open on the
# join" - we are handing it the answer instead of the session.
#
# ⚠ THIS WRITES. Moves players between teams mid-match. Run alone, one match,
#   read_only = 1 on the first pass. Test a lobby return afterwards.

game=T9
mode=mp
script=scripts\mp_common\bb.gsc
