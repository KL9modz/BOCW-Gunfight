# subtitle_probe_c — does the SUBTITLE channel take our text? A client payload, because the one
# builtin that prints there, subtitleprint( localClientNum, msec, text ), exists only in the client
# table (funcs_cw.csv: CSC, type 0, exe+2ab2460; BO3's script docs: "print to the subtitle channel").
# docs/notes/hud-channels.md §9.
#
# Runs on the HOST's client only (joiners run stock CSC). Registers nothing, replicates nothing.
#
# Pair (the client pair gunfight_menu_c ran on, 2026-09-10 / 09-13):
#     hook     scripts\core_common\load_shared.csc
#     replace  scripts\core_common\radiation_debug.csc
# One client payload at a time (they share the replace target); coexists with any .gscc.
#
# Build (client script -> .cscc, then the string-header strip, no exceptions):
#     acts gscc src\subtitle_probe_c\scripts\subtitle_probe_c.csc -g cw -p pc -c -o C:\bocw\payloads\subtitle_probe_c
#     .\tools\strip-strhdr.ps1 -In C:\bocw\payloads\subtitle_probe_c.cscc -Out C:\bocw\payloads\subtitle_probe_c.cscc
# Inject (game running, a private match loaded once; restart the match to link):
#     bash tools/inject.sh subtitle_probe_c
# ⚠ Settings -> Subtitles ON first: the channel is the one VO subtitles use, and the option may gate it.

game=T9
mode=mp
script=scripts\core_common\load_shared.csc
