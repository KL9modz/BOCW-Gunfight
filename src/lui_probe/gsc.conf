# LUI probe — does the stock ScriptMessageDialog_Compact popup render host-GSC text
# in an MP match? Server GSC only, no client payload, no memory write.
#
# Mirrors stock lui::open_generic_script_dialog (lui_shared.gsc:1040): openluimenu(
# "ScriptMessageDialog_Compact") + setluimenudata(#"title"/#"description", ...). The
# decompiled widget (lui-source, core_ui_1136/1145/1364) renders those fields through
# BaseUtility's localize-IF-hash helper, so a PLAIN string should draw as-is instead of
# crashing the way a LUIelemText string does (docs/notes/pause-menu.md, lui-elems.md).
# This measures that. Host-only (does it reach a joiner is a later test).
#
# Same hook as mp_probe / gunfight_menu. Inject INSTEAD of the menu for this launch
# (one payload per launch, shared replace target).

game=T9
mode=mp
script=scripts\mp_common\bb.gsc
