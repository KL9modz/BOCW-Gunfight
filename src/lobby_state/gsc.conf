# LOBBY STATE PROBE — read-only. What does the SESSION say the match is?
#
# Written 2026-09-11 the moment gunfight_menu's SESSION map method (switchmap_load +
# switchmap_switch, the call bbf94f9 had declared inert) switched the map AND the lobby
# followed. That call was judged inert while every ACTS-built string literal was being
# garbled by the engine (see tools/strip-strhdr.ps1); the map name reaching the engine
# intact is the one thing that changed.
#
# This payload settles "fluke or real" in one match: start the NEXT match from the
# lobby (not F7). A lobby-level switch loads the carried map and the readout names it;
# a load-time override reloads the lobby's own map and the readout names THAT.
#
# WRITES NOTHING. Reads dvars, gametype settings, session-mode builtins, player counts.
# Same MP hook as mp_probe. Clobbers whatever is injected (one payload at a time) —
# re-inject gunfight_menu afterwards; its settings live in gf_* dvars and survive.

game=T9
mode=mp
script=scripts\mp_common\bb.gsc
