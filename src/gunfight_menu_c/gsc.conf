# gunfight_menu_c — the CLIENT half of the LUI-element menu route. Stage 1 is a
# ONE-ELEMENT PROBE: open a single LUIelemText from an injected client script
# and see whether the MP client's LUI draws it, and whether it draws a PLAIN
# string. docs/notes/lui-elems.md.
#
# Runs on the HOST's client only (joiners run stock CSC). It registers no
# clientfields and replicates nothing, so a vanilla joiner is untouched by
# construction.
#
# Pair (the one that ran and printed in the MATCH client VM, 2026-09-10):
#     hook     scripts\core_common\load_shared.csc
#     replace  scripts\core_common\radiation_debug.csc   (0 bytes, nothing links it)
#
# Build (client script -> .cscc, then the string-header strip, no exceptions):
#     acts gscc src\gunfight_menu_c\scripts\gunfight_menu_c.csc -g cw -p pc -c -o C:\bocw\payloads\gunfight_menu_c
#     .\tools\strip-strhdr.ps1 -In C:\bocw\payloads\gunfight_menu_c.cscc -Out C:\bocw\payloads\gunfight_menu_c.cscc
# Inject (game running, a private match loaded once):
#     bash tools/inject.sh gunfight_menu_c
# Coexists with the gunfight_menu .gscc: different replace target (measured 2026-09-10).

game=T9
mode=mp
script=scripts\core_common\load_shared.csc
