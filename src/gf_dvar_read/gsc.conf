# gf_dvar_read — server-side readout for values a CLIENT script stashed in dvars.
#
# Pairs with src/test_uimodel_c/ hooked at frontend.csc: the client samples the
# lobby (where the UI model tree lives, and where prints do not render), this
# prints the stash in the match (where prints do render).
#
# ⚠ Runs ALONGSIDE the client payload. Allowed because they use different REPLACE
# targets - B9's rule is about sharing a replace, since injectcw overwrites that
# script's buffer:
#     client  frontend.csc -> radiation_debug.csc   (0 bytes)
#     server  bb.gsc       -> clientids_shared.gsc  (proven safe)

game=T9
mode=mp
script=scripts\mp_common\bb.gsc
