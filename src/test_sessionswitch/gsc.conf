# TEST B1 — switch map the way STOCK does, and watch whether the SESSION follows.
#
# The carry calls map(name) - one argument, zero stock callers anywhere in the
# dump - and afterwards everything that names the map is stale: menu, scoreboard,
# friend list, activity. Three stock systems (campaign transitions, side-mission
# launch, zombies) switch maps with switchmap_load(map, GAMETYPE) and the session
# stays correct. This test calls what they call.
#
# The friend list / activity is the criterion. Those are platform presence; no GSC
# builtin writes them; only the engine's session record does. If they flip, the
# session moved. If in-match UI flips and presence does not, the call reached the
# match but not the session - record that as its own result.
#
# ⚠ THIS WRITES. It changes map. read_only = 1 first. Only target maps already
#   carried to - mapexists() returns 1 for everything (B5) and is NOT a guard.

game=T9
