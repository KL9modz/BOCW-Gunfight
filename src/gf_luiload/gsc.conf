# gf_luiload — the CLIENT half of the LUI load test: call luiload() on our injected
# luafile-pool chunk and see whether the LUI VM loads + runs it (docs/notes/lui-dll-re.md,
# pause-menu.md). If it does, our chunk's StartMenu_Main override draws "GUNFIGHT MENU
# LOADED" in the ESC menu with NO DLL. If luiload no-ops, the DLL route (option A, same
# lj2t9 bytecode) is the fallback.
#
# Client pair (the one that ran + printed in the match client VM, gunfight_menu_c):
#     hook     scripts\core_common\load_shared.csc
#     replace  scripts\core_common\radiation_debug.csc   (0 bytes)
# Coexists with the gunfight_menu .gscc (different replace target) and with the
# gf_loadtest.luac pool inject (a luafile pool write, not a script replace).
#
# Build (CSC -> .cscc, then the header strip):
#   acts gscc src\gf_luiload\scripts\gf_luiload.csc -g cw -p pc -c -o C:\bocw\payloads\gf_luiload
#   .\tools\strip-strhdr.ps1 -In C:\bocw\payloads\gf_luiload.cscc -Out C:\bocw\payloads\gf_luiload.cscc
# Then (game free, a match loaded once): inject the pool chunk first, then this CSC:
#   python tools\lui\luapool.py --inject C:\bocw\payloads\gf_loadtest.luac --as 6766100000000001   (klaze - memory write)
#   bash tools\inject.sh gf_luiload
# restart the match to link, open ESC.

game=T9
mode=mp
script=scripts\core_common\load_shared.csc
